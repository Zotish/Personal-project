<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ImmigrantConnect USA</title>
  <meta name="description"
    content="Connect with immigrant communities, discover local services, and access support tailored for immigrants across the USA." />

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Mobile & PWA Capabilities -->
  <meta name="theme-color" content="#C04A22" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PatharSathi" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Intercept & silence rogue browser extension / VPN script crashes (e.g. 200.js reading 'M_ID') -->
  <script>
    (function() {
      function shouldIgnoreError(msg, src) {
        var str = (String(msg || '') + ' ' + String(src || '')).toLowerCase();
        return (
          str.indexOf('m_id') !== -1 ||
          str.indexOf('200.js') !== -1 ||
          str.indexOf('chrome-extension://') !== -1 ||
          str.indexOf('moz-extension://') !== -1
        );
      }

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack)) || reason;
        var stack = (reason && reason.stack) || '';
        if (shouldIgnoreError(msg, stack)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function(event) {
        var msg = event.message;
        var src = (event.filename || '') + ' ' + (event.error && event.error.stack ? event.error.stack : '');
        if (shouldIgnoreError(msg, src)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
    })();
  </script>

  <meta name="robots" content="noindex, nofollow" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>
</head>

<body>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
