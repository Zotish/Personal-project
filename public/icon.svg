<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C04A22" />
      <stop offset="100%" stop-color="#8C3015" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#brand-grad)" />
  
  <!-- Central Connectivity Icon -->
  <g filter="url(#glow)">
    <!-- Connected Bridge Rings -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="#FFF9E6" stroke-width="24" stroke-opacity="0.95" />
    <path d="M140 256 C140 180, 372 180, 372 256" fill="none" stroke="#FDE68A" stroke-width="28" stroke-linecap="round" />
    <path d="M150 280 C150 340, 362 340, 362 280" fill="none" stroke="#FDE68A" stroke-width="24" stroke-linecap="round" opacity="0.85" />
    
    <!-- Central Node Pin / Star -->
    <circle cx="256" cy="256" r="32" fill="#F59E0B" stroke="#FFFFFF" stroke-width="12" />
    <circle cx="170" cy="260" r="18" fill="#FFFFFF" />
    <circle cx="342" cy="260" r="18" fill="#FFFFFF" />
  </g>
</svg>
